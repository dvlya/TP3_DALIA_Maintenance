name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

defaults:
  run:
    working-directory: main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ '21', '25' ]

    steps:
      - uses: actions/checkout@v5

      - name: Configurer le JDK [21 - 25]
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: maven
      - name: Rendre mvnw executable
        run: chmod +x mvnw

      - name: Compiler et tester
        run: ./mvnw -B clean verify -Djava.version=${{ matrix.java-version }}

      - name: Publier le JAR
        if: matrix.java-version == '25'
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
